# Global defaults. Projects override with their own mise.toml / .nvmrc / .tool-versions.
# Python is managed by uv, Rust by rustup, Flutter by fvm, Terraform by tenv.
# Tools only one repo needs (sops, hcloud, flux…) belong in that repo's mise.toml, not here.
[tools]
node = "lts"
# pnpm and yarn through Corepack, at the version in each repo's `packageManager` field. Corepack
# is a tool of its own because Node 25+ no longer ships it. A standalone pnpm would win on PATH
# and refuse to switch versions under `corepack pnpm …`.
"npm:corepack" = "latest"
go = "latest"
java = "temurin-17"   # Android Gradle Plugin / Flutter Android builds
"npm:cf" = "1.0.0-beta.17"   # Cloudflare CLI (cloudflare/cf), beta: bump by hand. Not Homebrew's `cf`

[settings]
idiomatic_version_file_enable_tools = ["node", "go", "java", "bun"]
