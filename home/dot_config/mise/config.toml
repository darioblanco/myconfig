# Global defaults. Projects override with their own mise.toml / .nvmrc / .tool-versions.
# Python is managed by uv, Rust by rustup, Flutter by fvm, Terraform by tenv.
[tools]
node = "lts"
pnpm = "latest"   # pnpm honors each repo's `packageManager` field
bun = "latest"
go = "latest"
java = "temurin-17"   # Android Gradle Plugin / Flutter Android builds
tflint = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node", "go", "java"]
